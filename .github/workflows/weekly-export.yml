# Weekly export from hostedmcp.org: reads the catalog (read-only D1 REST token), commits data/ and README.md here,
# and uploads the same rows to huggingface.co/datasets/hostedmcp/mcp-servers-dataset. Sunday 04:30 UTC (11:30 WIB).
# The scripts are copies of tool/dataset/export.py, tool/dataset/hf_upload.py and tool/backup.py from HostedMCP.
name: Weekly export
on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency: weekly-export
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export from hostedmcp.org
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 scripts/export.py --github . --hf "$RUNNER_TEMP/hf"
      - name: Commit to GitHub
        run: |
          git config user.name "hostedmcp-dataset"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md LICENSE
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Dataset export $(date -u +%F)" && git push; fi
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub==0.26.2
          python3 scripts/hf_upload.py "$RUNNER_TEMP/hf"
      - name: Upload to Kaggle
        # kaggle.com/datasets/hostedmcp/mcp-servers-dataset (account hostedmcp, MIT), the same JSON files as data/.
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install --quiet kaggle six
          mkdir -p "$RUNNER_TEMP/kaggle"
          cp data/*.json "$RUNNER_TEMP/kaggle/"
          echo '{"id": "hostedmcp/mcp-servers-dataset"}' > "$RUNNER_TEMP/kaggle/dataset-metadata.json"
          kaggle datasets version -p "$RUNNER_TEMP/kaggle" -m "Weekly export $(date -u +%F)"
